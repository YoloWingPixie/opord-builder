      - kind: paragraph
        lead: Source selection.
        text: The source is the spaced filename Operation Steel Opera.miz, SHA-256 6a9bfb403461d4ea04bd3e2ffb26e8c36817a5f07a4073b50d96f57e3d712922.
          The newer hyphenated file was identified but not substituted.
