        - kind: paragraph
          lead: Traffic behavior.
          text: Generated departures use parking rather than the airborne-runway mode. Arrivals use a
            runway overflight at 100 ft AGL. The OMRK CTA ceiling applies specifically to this airport’s
            generated traffic.
        - kind: paragraph
          lead: Draft procedure.
          text: Keep clear of the depicted arrival and departure paths unless the flight has an assigned
