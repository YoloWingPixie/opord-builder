            instrument charts.
        - kind: paragraph
          lead: Traffic behavior.
          text: Departures are configured airborne at 100 ft AGL and 170 KIAS. Arrivals use a runway overflight
            at 100 ft AGL. Dubai and Sharjah departures also share a scheduling interval; this is not
            positive separation for military aircraft.
        - kind: paragraph
          lead: Draft procedure.
          text: Keep clear of the depicted arrival and departure paths unless the flight has an assigned
