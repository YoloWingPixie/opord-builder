    - kind: section
      title: Carrier operations
      blocks:
      - kind: paragraph
        lead: Carrier group.
        text: Carrier Strike Group 8 contains CVN-75 Harry S. Truman, CG-50 Valley Forge, DDG-96 Bainbridge,
          DDG-67 Cole, and DDG-107 Gravely. The carrier has a two-point route; it is not stationary. No
          cyclic launch/recovery schedule, final bearing, or recovery case is supplied.
      - kind: paragraph
        lead: Draft procedure — departure.
        text: Obtain the assigned departure, initial altitude, radio transfer, and route to the operating
          area. Maintain awareness of the actual ship position and civil traffic. Do not use the distant
          fixed CATCC rectangle as a substitute for local carrier traffic instructions.
      - kind: paragraph
        lead: Draft procedure — recovery.
        text:
        - text: 'Call the carrier on the channel in '
        - target: service-plan
        - text: ' and obtain current recovery instructions. Confirm the beacon discrepancy has been resolved,
            establish the assigned recovery case and sequence, and report fuel or system limitations before
            committing. No marshal radial, holding altitude, or emergency divert is invented here.'
      - kind: paragraph
        lead: Plane guard and recovery tanker.
        text: The SH-60B and S-3B exist as late-activation templates. The inspected triggers do not activate
          them. Treat rescue and recovery-tanker coverage as unavailable until specifically verified or
          added by the mission maker.
    - kind: section
      title: Civil air traffic and maritime restrictions
      blocks:
      - kind: paragraph
        lead: Civil traffic picture.
        text: The embedded traffic generator is configured for up to 40 active aircraft, with a startup
          target of half that limit. It adds airport arrivals and departures, with entry and exit altitude
          selections of 30,000–40,000 ft. Actual numbers and flight paths depend on initialization, aircraft
          availability, traffic spacing, and AI behavior.
      - id: civil-gates
        kind: table
        caption: Civil traffic entry gates and shared exits
        columns:
        - key: c0
          heading: Airport flow
        - key: c1
          heading: Arrival gates
        - key: c2
          heading: Departure exits
        rows:
        - c0: DXB
          c1: IVOBA, ASNIS, KUMBO
          c2: LOTAV, REXOD, TOTOX, PARAR, RASKI, LUDID
        - c0: AUH
          c1: IVOBA, HSA
          c2: LOTAV, REXOD, TOTOX, PARAR, RASKI, LUDID
        - c0: SHJ
          c1: IVOBA, ASNIS, KUMBO
          c2: LOTAV, REXOD, TOTOX, PARAR, RASKI, LUDID
        - c0: RKT
          c1: IVOBA, ASNIS, KUMBO
          c2: LOTAV, REXOD, TOTOX, PARAR, RASKI, LUDID
        - c0: FJR
          c1: LUDID, RASKI, PARAR
          c2: LOTAV, REXOD, TOTOX, PARAR, RASKI, LUDID
      - kind: paragraph
        lead: Draft procedure — unidentified traffic.
        text: Do not classify a contact as hostile solely from its presence in an operating area, airline
          paint scheme, lack of response, or map label. Report identity uncertainty and keep clear while
          it is resolved. Flight tasking must supply the applicable engagement authority.
      - kind: paragraph
        lead: Shipping.
        text: The shipping script is configured for up to 40 generated neutral vessels using the named
          port and sea-lane network. It applies a 0.5-NM lane offset and a 2-NM spawn-spacing criterion.
          These are generator parameters, not protected approach distances or weapons-release criteria.
      - kind: paragraph
        lead: BLOCKADE_HORMUZ.
        text: The mission defines a circular shipping blockade with a radius of 30,480 m (16.46 NM). The
          shipping generator adds a 0.5-NM buffer, plans to stop another 1 NM short, and seeks a holding
          position within its configured 5-NM holding radius. These are maritime-routing constraints;
          no airspace floor or ceiling is assigned.
      - kind: paragraph
        lead: Draft procedure — blockade and surface contacts.
        text: Expect neutral traffic to hold outside the blockade rather than disappear. Do not interpret
          stopping, holding, or approaching a port as engagement authority. Coordinate any flight activity
          over the blockade with the mission controller and keep the maritime restriction separate from
          aircraft clearances.
      - kind: paragraph
        lead: Minerva Nike.
        text: Minerva Nike is a blue-side merchant-vessel group with a unit-linked 3,000-m zone. The source
          does not publish a visit, boarding, attack, or rescue task for that vessel. Its presence and
          associated zone do not constitute player tasking.
    - kind: section
      title: Abnormal procedures and reporting
      blocks:
      - kind: paragraph
        lead: Draft procedure — lost communications.
        text: Attempt the last assigned agency and channel, then the prebriefed alternate or relay. Avoid
          uncoordinated entry into occupied control areas. Use the flight’s published lost-communications
          route and recovery decision; if none exists, settle it during the flight brief before departure.
      - kind: paragraph
        lead: Draft procedure — fuel or aircraft emergency.
        text: Advise the controlling agency of callsign, position, altitude, nature of the emergency,
          fuel/endurance, and intended action. Request priority and coordinate the recovery location.
          An unverified tanker is not an emergency-fuel plan.
      - kind: paragraph
        lead: Draft procedure — traffic conflict.
        text: Maintain aircraft control, report the conflict, and coordinate the maneuver and subsequent
          clearance. The civil scripts do not provide a live controller or guarantee that AI aircraft
          remain within their planned altitude and lateral limits.
      - kind: list
        style: lower_alpha
        items:
        - text: 'Entry/exit report: callsign, named measure, position, altitude, and next intention.'
        - text: 'Support request: callsign, requested service, position, fuel/endurance, and aircraft
            limitations.'
        - text: 'Mission completion: assigned task result, losses or damage, remaining stores and fuel,
            and recovery intention.'
        - text: 'Discrepancy report: observed condition, location/time, affected flight, and the specific
            instruction or aid involved.'
    - kind: section
      role: annex
      title: Mission-maker decisions and source traceability
      blocks:
      - kind: paragraph
        lead: Release status.
        text: This annex records the remaining decisions needed to issue the draft for player operations.
          It does not alter the source mission. The flight procedures above are proposed instructions;
          their existence in this document does not create simulator services or enforcement.
      - id: open-items
        kind: table
        caption: Decisions required before issue
        columns:
        - key: c0
          heading: Item
        - key: c1
          heading: Direct source evidence
        - key: c2
          heading: Required resolution
        rows:
        - c0: Carrier navigation
          c1: 'Briefing: TACAN 4X. Programmed carrier task: 75X / KU and ICLS 5.'
          c2: Choose the intended aid and align the mission and briefing. Draft service table reports
            the programmed values.
        - c0: ARCO availability
          c1: 'Briefing: 210 AM / 11Y. Present tanker template: TEXACO 1-1, 251 MHz / 1X, late activation.'
          c2: Provide and verify the intended tanker, or remove it from support planning.
        - c0: AWACS / rescue availability
          c1: E-2C and SH-60B are late-activation templates without a matching inspected activation action.
          c2: Activate and configure the intended services or explicitly plan without them.
        - c0: Carrier-control geometry
          c1: Carrier starts approximately 58.9 NM outside the fixed CVN75_CATCC rectangle.
          c2: Confirm whether the drawing is an intended operating box or needs relocation/replacement.
        - c0: Player tasking and SCL
          c1: No Player/Client aircraft, blue tasking text, or player loadouts are present.
          c2: Supply player access, flight assignments, targets, payloads, fuel limits, and recovery/alternate
            plans.
        - c0: Control staffing and clearance
          c1: Civil airspace definitions and traffic-routing logic are present; human agencies are not
            assigned.
          c2: Assign controllers/channels or brief explicit flight-to-flight deconfliction before issue.
        - c0: Altitude and time conventions
          c1: Map uses FL labels; script limits use feet MSL. Mission clock starts 06:00 with no verified
            UTC offset.
          c2: Brief altimeter/flight-level conventions and the common clock. Do not silently equate the
            two altitude references.
        - c0: Vertical separation
          c1: Civil-volume floors/ceilings are recorded in the traffic script; the 1,000-ft military planning
            margin is authored for this draft. OPERA ONE has a CTR crossing requiring profile resolution.
          c2: Confirm the margin and flight-specific vertical profile. Complete altitude changes outside
            occupied civil bands or coordinate a crossing.
        - c0: TACAN-only navigation
          c1: Calculated MA radials use verified terrain projection and the installed DCS June 2018 magnetic
            model. The map’s range is horizontal; the aircraft shows slant range.
          c2: Brief the full leg headings, assigned arc entry/exit, altitude reference, and recovery clearance.
            Check the reference values in the cockpit before issue.
        - c0: Al Dhafra route conventions
          c1: Common-layer HI/LO routes include UNLTD-12000, 4000-8000, and 12000-4000 text. WEST ARC
            and SOUTH ARC are nominal 15 DME MA reconstructed from approximate linework.
          c2: Confirm altitude conventions, arc direction/exits, and recovery clearance. Check the named
            procedures in DCS before issue.
        - c0: Engagement permissions
          c1: No blue mission task or player rules of engagement are published.
          c2: Define target authorization, identification, restrictions, and abort criteria in tasking.
