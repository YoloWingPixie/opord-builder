# yaml-language-server: $schema=../schemas/bundled/opord.schema.json
$schema: urn:openaix:schema:opord:0.2.0-draft.1
kind: opord
schema_version: 0.2.0-draft.1
date_time: '2026-04-17T12:00:00Z'
mission:
  statement: |-
    TF IRON will attack to seize OBJ HAMMER NLT H-hour (190500ZAPR26)
    IOT set conditions for follow-on IRON STRIKE operations.
    Provisional — final mission statement will issue with OPORD 26-04.
situation:
  enemy_forces:
    courses_of_action:
    - id: coa-most-likely
      kind: most_likely
      summary: |-
        Provisional: ENY defends forward slope of OBJ HAMMER with
        dug-in MRC and engages from the reverse slope with armor. Subject to
        revision after recon LD.
execution:
  commanders_intent:
    purpose: |-
      Defeat ENY defense of OBJ HAMMER to preserve freedom of
      maneuver for follow-on IRON STRIKE operations on
      the eastern approach. Key tasks and end state TBP in OPORD.
  coordinating_instructions:
    ccir:
      priority_intelligence_requirements:
      - id: pir-1
        question: Is ENY armor reinforcing OBJ HAMMER from HIGHWAY 22? (NLT 180600Z)
      - id: pir-2
        question: Are ENY fires observers forward of PL COPPER? (continuous)
      friendly_force_information_requirements:
      - id: ffir-1
        question: Combat power of TF IRON below 80% (report immediately)
      - id: ffir-2
        question: Any casualty > CAT B (report immediately)
    eefi:
    - id: eefi-1
      item: TF IRON routes and timing for movement to AA PATRIOT
    - id: eefi-2
      item: Rehearsal location and time
annexes:
  A:
    summary: |-
      Task organization for IRON STRIKE is published with
      this WARNO so subordinates can begin parallel planning against the
      confirmed command relationships. Remaining annexes TBP in OPORD.
meta:
  id: warno-01
  issued_at: '2026-04-17T12:00:00Z'
  revision: '1'
  title: WARNO 01
extensions:
  org.opord-builder.order:
    document_kind: warno
    warno_number: '01'
    base_order_path: example_full.yaml
    situation:
      enemy_forces:
        recent_activities: |-
          Preliminary assessment (BCT G2, 171000ZAPR26): ENY MRC + 2x T-72 section
          defending vic OBJ HAMMER (NK 135 785). Armor reinforcement
          status unclear; reconnaissance IPR scheduled 180600Z will refine MLCOA.
    execution:
      coordinating_instructions:
        earliest_movement_of_forces: |-
          Subordinate units may begin movement from current locations to AA PATRIOT
          NLT 180400ZAPR26 — prior to OPORD 26-04 issue. Movement must be complete
          NLT 181600ZAPR26 to support the combined-arms rehearsal.
        fscm: |-
          Provisional FSCMs: CFL on PL COPPER (effective H-2); RFA vic OBJ HAMMER
          (active H-1 to H+2). Full fire-support coordination measures TBP in OPORD.
        orders_group:
          attendees: TF Cdr, TF XO, S1-S6, Co Cdrs, Scout Plt Ldr, FSO, ALO, Engr LNO, BSB SPO LNO
          dtg: 181800ZAPR26
          location: TF IRON TOC, AA PATRIOT
          products_distributed: OPORD 26-04, execution matrix, fires overlay, sustainment overlay, R&S
            plan, signal PACE card
          purpose: Issue OPORD 26-04 and receive subordinate-commander confirmation briefs.
        reconnaissance_and_surveillance_instructions: |-
          Scout Plt executes zone reconnaissance vic NAI 7 IAW Annex L (Information
          Collection). Focus: confirm ENY armor disposition on HIGHWAY 22 and
          forward slope of OBJ HAMMER. Coordinate BCT Puma UAS coverage
          for NAIs 7 and 8 during recon LD window. R&S results inform the
          confirmation brief.
        rehearsal:
          dtg: 182000ZAPR26
          location: BN TOC terrain-model site, AA PATRIOT
          method_notes: 'Full combined-arms rehearsal covering fires, movement, and passage of lines.
            Actions-on drills walked by phase. Uniform: duty; bring map, matrix, graphics.'
          participants: TF Cdr, Co Cdrs, Plt Ldrs, FSO, JTAC, S3 shop, Scout Plt Ldr, Engr LNO
          type: terrain-model
        time_line:
        - dtg: 180600ZAPR26
          event: Recon LD
          notes: Confirm ENY armor disposition vic NAI 7; feeds confirmation brief.
          responsible: Scout Plt (SAPPER 2)
        - dtg: 181000ZAPR26
          event: Confirmation Brief
          notes: All subordinate commanders back-brief understanding of intent and tasks.
          responsible: TF IRON Co/Plt Cdrs
        - dtg: 182000ZAPR26
          event: Combined-Arms Rehearsal
          notes: Full CAR at BN TOC; fires, movement, passage of lines.
          responsible: TF S3
        - dtg: 181800ZAPR26
          event: OPORD Issue
          notes: Full OPORD 26-04 published; supersedes this WARNO.
          responsible: TF S3
        - dtg: 190500ZAPR26
          event: LD / H-Hour
          notes: Operation commences; assault on OBJ HAMMER.
          responsible: TF IRON
    annexes:
      A:
        status: published
        typed_body:
          task_organization_list:
          - callsign: IRON 6
            commander: LTC T. Marquez
            name: TF IRON (2-503 IN ABN)
            role: Battalion Main Effort
            subordinate_units:
            - callsign: ABLE 6
              name: A Co / 2-503 IN
              role: Assault — Main Effort, Phase II
            - callsign: BRAVO 6
              name: B Co / 2-503 IN
              role: Supporting Effort — seize ANVIL
            - callsign: CHARLIE 6
              name: C Co / 2-503 IN
              role: Reserve
            - callsign: DELTA 6
              name: D Co (Wpns) / 2-503 IN
              role: Heavy Wpns — ATGM priority
            - callsign: SAPPER 2
              name: Scout Plt
              role: Recon / OP 3 at NAI 8
