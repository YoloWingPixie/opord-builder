    situation:
      area_of_interest: The area of interest extends 50 km beyond the AO boundary, encompassing HIGHWAY
        22 eastbound to the BORDER (grid N7234) and all towns and transportation nodes that could resource
        enemy reinforcement of OBJ HAMMER within 24 hours.
      area_of_operations:
        terrain:
          avenues_of_approach: Two platoon-sized mounted AAs from the south (ROUTE CLUB, ROUTE SPADE);
            one company-sized dismounted AA along the eastern treeline (ROUTE DIAMOND).
          cover_and_concealment: Dense coniferous cover throughout the AO; limited cover in the cleared-fields
            corridor (east-west). Urban cover in VIC ALTENSTADT (NK 115 790).
          key_terrain: 'OBJ HAMMER (MR-342 ridge). Decisive terrain: the eastern spur, grid NK 142 783,
            which controls observation of ENY fallback positions.'
          observation_and_fields_of_fire: OBJ HAMMER sits on a 340m ridgeline offering 3–4 km observation
            east; forest canopy restricts fields of fire to <200m off the ridge.
          obstacles: Stream line along PL BRONZE (fordable for dismounts); mined wire obstacle belt templated
            vicinity NK 138 779 (IPB-confirmed).
        weather:
          climate_baseline: 'Bavarian Oberpfalz late-April climatology: daytime 8–16°C, nightly 2–6°C;
            prevailing winds W/SW 8–12 kt; monthly precipitation ~55 mm (primarily afternoon showers);
            freeze risk LOW after 15 APR. Typical ceiling 3,500– 8,000 ft with 40–60% probability of BKN
            mid-level cloud. Training area has historically experienced morning ground-fog episodes ≤2
            km visibility until ~0700L in valleys (ROUTE CLUB east leg).'
          cloud_cover: BKN 4,500 ft; overcast by 181800Z; CAS ceiling remains above 3,000 ft AGL.
          effects_on_operations: 'NET: weather FAVORS friendly operations across the campaign window.
            Decisive Phase II (190500–190800Z) executes in a confirmed dry, clear window with 62% NVG-usable
            illumination and ceilings well above CAS and UAS minimums. ENY Orlan-10 effectiveness reduced
            during Phase I precip windows. Principal risks: trafficability on ROUTE CLUB post-1800Z 18
            APR (mitigate with ASR SPADE); overnight cold exposure in consolidation. No weather-driven
            branch or abort trigger anticipated.'
          forecast_by_period:
          - cloud_cover: BKN 4,500 ft, dropping to OVC 3,500 ft by 181800Z.
            effects_on_operations: FAVORS friendly reconnaissance (reduced ENY Orlan-10 utility in showers).
              Trafficability on ROUTE CLUB degraded post-1800Z — consider ASR SPADE for wheel traffic.
              CAS remains feasible; minimum ceiling >3,000 ft AGL.
            period_end: 190100ZAPR26
            period_start: 180600ZAPR26
            phase_or_day: Phase I (Shaping, D-1 / 18 APR)
            precipitation: 40% intermittent rain 181400–182000Z; 2–4 mm accum.
            temperature_and_humidity: Hi 14°C / Lo 5°C; RH 70–85%.
            visibility: 10 km dropping to 2 km 181400Z–182000Z in showers.
            winds: W 10–15 kt, gusts 22 kt.
          - cloud_cover: SCT 5,000 ft; CAS stack clear.
            effects_on_operations: FAVORS friendly airborne / dismounted assault. 62% illum supports NVG
              operations during H-hour window (BMNT 0518Z, LD at 0500Z). 12-min artillery prep timing
              matches usable first-light. VIPER 11/12 CAS ingress corridor clear. No obscurant needed
              for breach unless ENY counter-prep.
            light_data:
              bmnt: 0518Z
              date: '2026-04-19'
              eent: 1858Z
              moon_phase: waxing gibbous
              percent_illumination: 62.0
