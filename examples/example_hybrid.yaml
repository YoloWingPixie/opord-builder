  B:
    summary: |-
      Enemy on OBJ HAMMER is assessed as a reinforced motorized rifle company (+), approximately 120 pax, with 4x BMP-2, an 82mm mortar section, a ZU-23-2 AAA piece sited for ground role, and Orlan-10 UAS support cueing from regimental level. Enemy is dug in along the MR-342 ridge with primary positions on the eastern spur vic. NK 142 783, tied into a wire and AT-ditch obstacle belt at NK 138 779. Most dangerous COA is reinforcement by a motorized rifle platoon (+) from the north along HIGHWAY 22 within 90 minutes of contact; most likely COA is defense in sector with harassment by Orlan-10 and indirect fires from depth.

      PIRs drive collection: (1) location and timing of enemy reinforcement along HIGHWAY 22; (2) composition and condition of the obstacle belt at NK 138 779; (3) Orlan-10 launch/recovery site; (4) enemy CP vic. OBJ HAMMER. HVTs are, in priority: enemy CO CDR, mortar FDC, ZU-23 crew, Orlan-10 GCS, and BMP section leaders. S-2 publishes updated SITEMPs, MCOOs, and the HVT list every 12 hours beginning 181800ZAPR26, pushed through SharePoint and Nett Warrior.

      BCT MICO provides reinforcing SIGINT and GEOINT products; 173 RSTA SQDN provides reconnaissance handover NLT 190300ZAPR26. S-2 maintains the collection synchronization matrix (Annex L, Appendix 4) and deconflicts with BCT ACE. Counterintelligence focus is on insider threat during mission staging at Camp Aachen and host-nation contractor access to the BSA.
  C:
    summary: |-
      The concept of operations expands the base order's scheme of maneuver across three phases. In Phase I (Shaping, 180600Z–190500ZAPR26), B Co conducts a feint toward OBJ ANVIL to fix the enemy's southern platoon while Scout Plt screens HIGHWAY 22 and confirms the enemy template. In Phase II (Decisive, 190500Z–190800ZAPR26), A Co, following SAPPER 2's breach of the obstacle belt at NK 138 779, assaults along AXIS GOLD to seize OBJ HAMMER. In Phase III (Consolidate, 190800Z–200600ZAPR26), TF IRON reorganizes on OBJ HAMMER, establishes hasty defense oriented north, and prepares to hand the objective off to 1-503 IN for follow-on operations against OBJ FALCON.

      The Operation Overlay (App 2) depicts AA EAGLE, AXIS GOLD, PL SILVER (LD), PL BRONZE (FSCL/CFL), PL COPPER (LOA), OBJ HAMMER, OBJ ANVIL, and SBFs 1 and 2. The Decision Support Matrix (App 3) addresses three decision points: DP1 — commit reserve (trigger: A Co combat power below 70% prior to PL BRONZE); DP2 — shift fires to counter reinforcement (trigger: enemy platoon (+) south of GRID LINE 80 on HIGHWAY 22); DP3 — transition to Phase III (trigger: OBJ HAMMER cleared, no enemy activity within 2 km for 30 minutes).

      Branches addressed: (1) enemy reinforces early — C Co assumes blocking position vic. NK 128 787, fires shift to interdict HIGHWAY 22; (2) obstacle belt exceeds template — SAPPER 2 executes deliberate breach with second MICLIC, A Co delays assault 30 minutes, B Co extends fix on OBJ ANVIL. Sequel is battle handover to 1-503 IN NLT 200400ZAPR26 IVO OBJ HAMMER, TF IRON retrograde to AA EAGLE for refit.
