            visibility: 10+ km; clear to partly cloudy.
            winds: W 8–12 kt, backing SW.
          - cloud_cover: SCT 5,000 ft; OVC 8,000 overnight.
            effects_on_operations: Transition and hand-off to 1-503 IN unaffected. Overnight low 3°C with
              wind chill ~0°C on OBJ HAMMER ridge — enforce cold-weather precautions for personnel in
