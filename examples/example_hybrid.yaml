        - Scout Plt / HHC / 2-503 IN (TACON to 173 RSTA, 180600ZAPR26–200600ZAPR26)
        note: See Annex A (Task Organization) for detailed relationships.
      civil_considerations:
        areas: Training area bounded by civilian farmland north of PL STEEL; civilian access to forest
          mushroom-gathering trails must be deconflicted.
        capabilities: Local Bundeswehr MP can respond to training incidents within 20 min; Vilseck hospital
          (Role 3 equivalent) 18 km east.
        events: Easter holiday weekend active in adjacent villages; no impact on AO.
        organizations: Bavarian Forestry Authority monitors live-fire boundary compliance.
        people: Range workers (Bundeswehr civilians) transit range roads 0530–1800L. All movement on ROUTE
          CLUB between those times requires range-control clearance.
        structures: 'Protected: ALTENSTADT village chapel (NK 115 790); no direct or indirect fires within
          500m. Historical marker at NK 121 788.'
      enemy_forces:
        capabilities: Defend in place; counterattack with a mounted platoon (+) within 2 hrs; disrupt
          with indirect fires from 82mm mortars out to 4 km; limited UAS (Orlan-10 templated) capability
          for ISR.
        recent_activities: Over the past 72 hours, ENY has conducted dismounted patrols to PL BRONZE,
          emplaced obstacle belt NK 138 779, and rehearsed counterattack from the east using reinforcing
          elements.
      friendly_forces:
        adjacent_units: 'NORTH: 1-503 IN conducts supporting attack to fix ENY on OBJ ANVIL. SOUTH: 4-319
          AFAR provides GS fires. EAST: 173 RSTA conducts screen along HIGHWAY 22.'
        other_units: Host-nation Bundeswehr liaison element co-located at BCT MAIN CP for range deconfliction
          and civil coordination.
      interagency_intergovernmental_ngo: Bundeswehr Grafenwoehr Training Area Command, Bavarian Red Cross
        (range medical standby), and USAG Bavaria coordinate on training-area access, safety, and emergency
        response.
    execution:
      assessment: 'MOEs: (1) seizure of OBJ HAMMER by 190900Z; (2) enemy combat power on OBJ HAMMER reduced
        below 30%; (3) friendly casualties below 10%. MOPs: breach complete NLT 190445Z; artillery rounds
        on target per TVA; transition to follow-on NLT 200600Z. See Annex M.'
      commanders_intent:
        end_state_civil: No civilian casualties; ALTENSTADT village and cultural sites unaffected.
        end_state_enemy: Enemy force on OBJ HAMMER destroyed or forced to withdraw east of HIGHWAY 22.
        end_state_friendly: TF IRON consolidated on OBJ HAMMER, >90% combat power, Class V at 70% basic
          load.
        end_state_terrain: OBJ HAMMER (MR-342 ridge) and eastern spur under friendly control and observation.
      concept_of_operations:
        decisive_operation: A Co assaults OBJ HAMMER at 190500Z, seizes the ridge and eastern spur, and
          consolidates.
        fires: See Annex D. Priority of fires to A Co during Phase II.
        maneuver: A Co conducts the decisive operation as the main effort with dismounted assault along
          AA DIAMOND. B Co fixes ENY on OBJ ANVIL. C Co is reserve prepared to reinforce A Co or defeat
          counterattack. D Co provides direct-fire support from SBF-1 (NK 132 778).
        reserve: C Co is reserve, held at AA BRONZE, prepared to reinforce A Co (PRIORITY) or block enemy
          counterattack along ROUTE DIAMOND.
        shaping_operations: B Co fixes the ENY platoon on OBJ ANVIL; SAPPER 2 breaches the wire obstacle
          belt at NK 138 779 NLT 190430Z; STEEL 6 delivers 12-minute artillery preparation on OBJ HAMMER
          190448Z–190500Z.
        sustaining_operations: Combat Trains (CTCP) established vicinity NK 118 772 by 190400Z. Ambulance
          exchange point (AXP) at NK 125 776. CL III/V resupply by LMTV convoy from BSA every 8 hrs.
      coordinating_instructions:
        acm: Restricted Operations Zone over OBJ HAMMER 190400–190800Z to 5,000 ft AGL for friendly UAS.
        cema: EW detection reports directly to BN S-2; no offensive effects at BN level.
        effective_time: This OPORD is effective 181200ZAPR26.
        environmental_considerations: No pyrotechnic use within 100m of ALTENSTADT; fuel/waste returned
          to BSA.
        fscm: Coordinated Fire Line along PL BRONZE. No-fire area 500m radius around ALTENSTADT village
          (NK 115 790).
        personnel_recovery: Isolated-personnel reporting to BN TOC; recovery by C Co on order. ISOPREP
          current for all personnel.
        risk_reduction_control_measures: All live-fire conducted under range-safety oversight. Chemlight
          recognition signals for night movement. No-fire 500m bubble around ALTENSTADT. MOPP level 0
          (mission-tailored).
        themes_and_messages:
        - We train hard to fight and win.
        - We honor our host-nation partners.
        - Every paratrooper is accountable.
      scheme_of_cema: GPS, SATCOM, and FM remain unrestricted. No offensive cyber effects tasked at BN.
        EW detection alarm to BN S-2 on any jamming above threshold.
      scheme_of_military_deception: No deception operation planned for this mission.
      scheme_of_reconnaissance_and_security: Scout Plt (TACON to 173 RSTA) screens along HIGHWAY 22 NLT
        180600Z through 200600Z; provides early warning of eastern ENY movement. TF IRON R&S elements
        observe OBJ HAMMER from OP 1 (NK 131 780) and OP 2 (NK 144 785) from 181200Z.
      scheme_of_signal: 'FM primary, TACSAT secondary. Battalion command net, fires net, and logistics
        net active. Data: Nett Warrior for COP. See Annex H.'
      scheme_of_sustainment: See Paragraph 4 and Annex F.
      stability: Not applicable for this mission — limited to training area; no host-nation civilian effects
        beyond range deconfliction.
      tasks_to_subordinate_units:
        a-co-2-503-in:
          callsign: ABLE 6
          priorities: CL V resupply (PRI 1); MEDEVAC lift (PRI 2).
          purpose: Seize OBJ HAMMER as decisive operation.
        b-co-2-503-in:
          callsign: BRAVO 6
          purpose: Fix ENY platoon on OBJ ANVIL to prevent reinforcement of OBJ HAMMER.
        c-co-2-503-in:
          callsign: CHARLIE 6
          purpose: Serve as TF reserve; defeat ENY counterattack or reinforce A Co.
        d-co-weapons-2-503-in:
          callsign: DOG 6
          purpose: Provide direct fire support from SBF-1.
        x-2d-plt-a-co-54th-beb:
          callsign: SAPPER 2
          purpose: Breach ENY obstacle belt to enable A Co assault.
        btry-b-4-319-afar:
          callsign: STEEL 6
          purpose: Provide direct support fires to TF IRON.
    sustainment:
      health_services:
        combat_operational_stress_control: BN Chaplain and UMT on call; BN aid station has OSC trained
          NCO.
        dental_services: Emergency dental only; reachback to BSA.
        medical_command_and_control: BN Surgeon runs casualty ops from BN TOC; coordination with BCT Role
          2 at BSA.
        medical_evacuation: Ground MEDEVAC via AXP at NK 125 776. Air MEDEVAC on call from BCT Role 2
          pad; 9-line to BN TOC on BN CMD net.
        medical_logistics: 'CL VIII push from BCT Role 2 every 12 hrs. Blood products: 4 PRBC at BAS.'
        medical_treatment: Role 1 at each company trains; BN aid station at CTCP (NK 118 772). Role 2
          at BSA (Grafenwoehr main); Role 3 at Vilseck (18 km east).
        preventive_medicine: Water quality checks 2x/day at CTCP. Tick/vector briefing issued to all personnel.
      logistics:
        contract_support: Range ammunition support via Bundeswehr contract; coordinated through BCT S-4.
        distribution: Supply point distribution at CTCP; unit distribution forward to company trains on
          call.
        field_services: Mortuary affairs collection point at CTCP. Shower/laundry at BSA every 72 hrs.
        maintenance: 'Field-level maintenance at CTCP (NK 118 772). Controlled exchange authorized for
          CL IX parts below $500. BDAR authority: Co Cdrs.'
        supply: 'CL I: MRE for 3 days, hot meal push 2x/day. CL III: LOGPAC every 8 hrs. CL V: 100% basic
          load carried, resupply pre-positioned at CTCP. CL VIII: See AHS below. Water: 4 L/soldier/day.'
        sustainment_overlay: See Annex F, Appendix 1.
        transportation: MSR CLUB (primary), ASR SPADE (alternate). Ambulance exchange at AXP at NK 125
          776. Convoys in packets of 4 vehicles minimum.
      personnel_services:
        financial_management: No finance operations in AO; reachback to BCT FMSC as needed.
        human_resources_support: PERSTAT every 6 hrs via BN S-1. R&R policy per BCT directive.
        legal_support: BN JAG available via BCT SJA. ROE questions to BN S-3; detainee legal review by
          BCT SJA.
        religious_support: UMT circulates among companies every 24 hrs. Memorial services on order.
    command_and_signal:
      command:
        command_posts: BN Main CP at AA BRONZE (NK 108 768) from 180600Z. BN TAC CP co-located with A
          Co from 190430Z through consolidation. BN Combat Trains CP (CTCP) at NK 118 772 from 190400Z.
        location_of_commander: BN CDR forward with A Co from 190445Z through consolidation; returns to
          BN TOC NLT 190900Z.
        succession_of_command:
        - Battalion Commander (IRON 6)
        - Battalion Deputy Commander (IRON 5)
        - Battalion S-3 (IRON 3)
        - Battalion Executive Officer (IRON 7)
      control:
        command_and_support_relationships: Btry B / 4-319 AFAR is DS to TF IRON from 180600Z. 2d Plt /
          A / 54 BEB is OPCON from 181800Z.
        liaison_requirements: LNO from 1-503 IN at BN Main CP from 181200Z. LNO from Btry B / 4-319 at
          BN Main CP from 180600Z. BN LNO to BCT TOC from 180600Z.
      signal:
        cema: Any GPS or comms jamming reported to BN S-2 immediately on BN CMD net.
        recognition_and_identification: 'Near recognition: running password GLADIATOR / countersign HORNET.
          Far recognition: orange VS-17 panel during daylight; IR strobe at night. Challenge/password
          changes 180001Z daily.'
        soi_edition: SOI Edition 04-26 effective 180001Z–210001ZAPR26.
    annexes:
      A:
        status: published
      B:
        status: published
        appendices:
        - body: Running estimate maintained by S-2 and updated every 12 hours. Focus on enemy MLCOA/MDCOA,
            obstacle belt composition, and reinforcement triggers along HIGHWAY 22.
          number: 1
          title: Intelligence Estimate
        - body: BCT CI team screens host-nation contractor access at BSA and conducts insider-threat awareness
            briefs prior to SP. No known FIS targeting of the training event.
          number: 2
          title: Counterintelligence
        - body: BCT MICO SIGINT platoon provides reinforcing collection against enemy C2 nets on OBJ HAMMER;
            cueing pushed to S-2 within 15 minutes of detection. No organic BN SIGINT capability.
          number: 3
          title: Signals Intelligence
        - body: No HUMINT operations in the AO; all source interaction with role-players coordinated through
            BCT G-2X. Soldiers report observations through SALUTE on BN O/I net.
          number: 4
          title: Human Intelligence
        - body: BCT GEOINT cell provides 1:25,000 overprints of OBJ HAMMER with updated obstacle and SITEMP
            overlays every 12 hours. Digital products pushed via SharePoint.
          number: 5
          title: Geospatial Intelligence
        - body: Not resourced at BN level; any MASINT tipping flows from BCT ACE. Report thermal or acoustic
            anomalies through SPOTREP.
          number: 6
          title: Measurement and Signature Intelligence
        - body: S-2 monitors host-nation press and social media for training-area disruption or protest
            activity. No adversary OSINT collection assessed.
          number: 7
          title: Open-Source Intelligence
        - body: 'Recover and tag enemy equipment, documents, and UAS airframes (priority: Orlan-10 wreckage)
            for exploitation through BCT TECHINT cell. Do not disassemble on site.'
          number: 8
          title: Technical Intelligence
        typed_body:
          assumptions:
          - ENY 3d MRR tank battalion does not commit west of HIGHWAY 22 before 200600ZAPR26.
          - Weather remains flyable for CAS and BCT Puma UAS throughout Phase II.
          - GPS remains available; no degradation from Orlan-10 GCS co-located EW.
          enemy_courses_of_action:
          - adoption_probability: high
            associated_nais:
            - NAI 1
            - NAI 3
            - NAI 7
            designation: MLCOA
            indicators:
            - Continued obstacle reinforcement vic NK 138 779
            - Orlan-10 launches from vic NK 161 792
            - Tank PLT staging vic HIGHWAY 22 km marker 47
            narrative: ENY MRC(+) defends the ridge with two platoons forward and one in reserve; fixes
              friendly forces forward of obstacle belt NK 138 779; defeats penetration by counterattack
              from the east with tank PLT from 3d MRR reserve along HIGHWAY 22.
            title: Defend in sector on MR-342 ridge
          - adoption_probability: low
            associated_nais:
            - NAI 3
            - NAI 5
            designation: MDCOA
            indicators:
            - Tank company-sized movement south of GRID LINE 80 prior to 190300Z
            - Shift of ENY C2 emitter vic HIGHWAY 22 km 45
            narrative: ENY preempts with a mounted spoiling raid from HIGHWAY 22 at 180400Z against friendly
              assembly area; defeats TF IRON before LD; follows with deliberate defense of OBJ HAMMER
              and commitment of reinforcing MRR company (+) from the east.
            title: Spoiling attack from HIGHWAY 22
          high_value_target_list:
          - category: C2
            engagement_guidance: Neutralize with FA HE/PD on acquisition; avoid CDE in ALTENSTADT NFA.
            hpt_nomination: true
            likely_locations:
            - OBJ HAMMER crest
            - Reverse slope NK 143 784
            linked_pir:
            - 4
            priority_rank: 1
            signature: 3-4 antenna vehicles, HMMWV-class tracks, VHF emissions 30-88 MHz
            target_description: ENY MRC Commander and CP (est. NK 142 783)
          - category: AIR_DEFENSE
            engagement_guidance: SEAD — suppress H-2 to H+10 for VIPER 11/12 ingress.
            hpt_nomination: true
            likely_locations:
            - Northern spur OBJ HAMMER
            linked_pir:
            - 4
            priority_rank: 2
            signature: Twin 23mm barrels, towed prime mover, personnel clustering
            target_description: ZU-23-2 AAA piece (ground role) vic NK 140 781
          - category: FIRES
            engagement_guidance: Destroy on first firing; counter-battery cued to STEEL 6.
            hpt_nomination: true
            likely_locations:
            - Reverse slope NK 145 787
            linked_pir:
            - 4
            priority_rank: 3
            signature: Q-53 radar acquisition; launch acoustic signature
            target_description: 82mm mortar section (2 tubes)
          - category: ISR
            engagement_guidance: DESTROY on acquisition; EW jam prior to kinetic strike.
            hpt_nomination: true
            likely_locations:
            - NAI 7 NK 155 795
            linked_pir:
            - 3
            priority_rank: 4
            signature: Catapult launch rail; 9.6m antenna mast; 2-4 vehicle footprint
            target_description: Orlan-10 GCS and launch team
          - category: MANEUVER
            engagement_guidance: Destroy with Javelin/TOW/CAS as acquired.
            hpt_nomination: false
            likely_locations:
            - Platoon strongpoints on MR-342 ridge
            linked_pir:
            - 4
            priority_rank: 5
            signature: Tracked IFV thermal signature; crew of 3 + 7 dismounts
            target_description: BMP-2 section (4 vehicles)
          priority_intelligence_requirements:
          - decision_supported: Commit C Co reserve to block vs. continue east.
            indicators:
            - Tank-company-sized movement (10+ vehicles) westbound HIGHWAY 22
            - Increased ENY C2 traffic on 46.725 MHz
            - POL resupply column vic HIGHWAY 22 km 50
            ltiov: 190200ZAPR26
            nai:
            - NAI 3 (HIGHWAY 22 km 47)
            - NAI 5 (NK 152 799)
            number: 1
            primary_collector: Scout Plt OP 1 (TACON 173 RSTA)
            statement: Will the enemy reinforce OBJ HAMMER from HIGHWAY 22 before 190500ZAPR26?
          - decision_supported: SAPPER 2 lane selection and MICLIC reserve positioning.
            indicators:
            - Visual confirmation of AT-mine signatures via UAS FMV
            - Engineer recon report of wire density and anchor spacing
            ltiov: 190430ZAPR26
            nai:
            - NAI 2 (obstacle belt NK 138 779)
            number: 2
            primary_collector: BCT Puma UAS; Scout Plt OP 2
            statement: Is the obstacle belt at NK 138 779 mined or wire-only?
          - decision_supported: Engage Orlan-10 GCS as HPT; deconflict ROZ HAMMER.
            indicators:
            - Catapult signature visible in EO imagery
            - UHF data-link emissions 902-928 MHz
            ltiov: 190400ZAPR26
            nai:
            - NAI 7 (suspected GCS vic NK 155 795)
            number: 3
            primary_collector: BCT MICO SIGINT
            statement: Where is the Orlan-10 launch/recovery site?
          - decision_supported: Priority target nomination for STEEL 6 preparation fires.
