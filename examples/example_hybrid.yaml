            - Increased foot traffic at suspected CP vehicle
            ltiov: 190300ZAPR26
            nai:
            - NAI 4 (OBJ HAMMER crest, NK 142 783)
            number: 4
            primary_collector: BCT Puma UAS orbit 190430-190800Z
            statement: Location of enemy CP on OBJ HAMMER?
      C:
        status: published
        appendices:
        - body: Single 1:25,000 overlay depicting graphic control measures, unit boundaries, SBFs, and
            objectives. Published in Nett Warrior and as hardcopy hand-off at OPORD brief.
          number: 2
          title: Operation Overlay
        - body: DSM with three decision points tied to CCIR, a synchronization matrix aligning maneuver,
            fires, and sustainment by phase, and a decision-point execution checklist for the BN XO.
          number: 3
          title: Decision Support Products
        - body: IO theme is deterrence through visible readiness; no offensive IO effects authorized in
            training AO. Internal messaging emphasizes mission focus and host-nation partnership.
          number: 8
          title: Information Operations
        - body: BN ADAM/BAE cell coordinates through BCT airspace element; ROZ HAMMER active 190430Z–190800ZAPR26
            from surface to 5,000 ft AGL for Puma UAS and CAS stack. Deconfliction with Grafenwoehr range
            airspace IAW range SOP.
          number: 10
          title: Airspace Control
        - body: Training ROE IAW USAREUR-AF Reg 350-1 and Grafenwoehr Range SOP; blank/simunition only
            on OBJ HAMMER, live-fire only in designated impact areas. PID and positive target discrimination
            required; ALTENSTADT village (NK 115 790) is a NO FIRE AREA.
          number: 11
          title: Rules of Engagement
        - body: Defensive cyberspace operations only; BCT CEMA cell monitors BN network. No offensive
            cyber effects authorized. EW posture is EMCON-reduced until 190500ZAPR26, full emissions thereafter.
          number: 12
