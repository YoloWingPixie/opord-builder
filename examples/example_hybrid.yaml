mission:
  statement: TF IRON attacks NLT 190500ZAPR26 to seize OBJ HAMMER (vic. NK 142 783) IOT enable 173d IBCT
    (A) follow-on operations against OBJ FALCON.
situation:
  area_of_operations:
    summary: AO IRON is bounded by PL STEEL (north), PL BRONZE (south), GRID LINE 23 (west), and HIGHWAY
      22 (east). Dominated by rolling mixed forest with cleared agricultural corridors north–south. See
      Annex C, Appendix 2 (Operation Overlay).
  enemy_forces:
    summary: Motorized rifle company (+) templated on OBJ HAMMER; est. 120 PAX with 4× BMP-2, 2× 82mm
      mortar, 1× ZU-23 AAA, engineer squad. Company is dug in, two platoons forward, one in reserve.
    courses_of_action:
    - id: coa-most-likely
      kind: most_likely
      summary: ENY defends OBJ HAMMER with two platoons forward, uses obstacle belt and direct fire to
        canalize friendly attack into EA IRON, then counterattacks with mounted reserve from the east
        along ROUTE DIAMOND.
    - id: coa-most-dangerous
      kind: most_dangerous
      summary: ENY pre-empts the attack with a spoiling raid at 180400Z against friendly assembly area
        at GRAFENWOEHR (OBJ TUNGSTEN), followed by deliberate defense of OBJ HAMMER and commitment of
        a reinforcing company (+) from the EAST.
  friendly_forces:
    higher_one_level:
      name: 2d Squadron / 503d IN / 173d IBCT (A)
      mission: 2-503 IN attacks NLT 190500ZAPR26 to seize OBJ HAMMER IOT enable 173d IBCT operations against
        OBJ FALCON.
      commanders_intent: 'Mass combat power on OBJ HAMMER; hand off to follow-on forces without losing
        tempo. End state: OBJ HAMMER secured; 2-503 postured for follow-on to OBJ FALCON by 200600Z.'
    higher_two_levels:
      name: 173d IBCT (A)
      mission: 173d IBCT (A) conducts airborne assault NLT 170500ZAPR26 to seize OBJ FALCON (MR-310 key
        terrain complex) IOT set conditions for division follow-on ops in AO KNIGHT.
      commanders_intent: 'Rapid seizure of key terrain to deny the enemy operational initiative. End state:
        OBJ FALCON under friendly control; enemy unable to reconstitute combat power; host-nation populace
        secure.'
  assumptions:
  - id: as-1
    assumption: Weather remains flyable for CAS and MEDEVAC throughout the operation.
  - id: as-2
    assumption: Host-nation range clearance remains continuous through 200600ZAPR26.
  - id: as-3
    assumption: Enemy does not receive reinforcement of more than a platoon within 24 hrs.
execution:
  commanders_intent:
    purpose: Generate an overmatch of combat power on OBJ HAMMER fast enough to preempt enemy counterattack
      and hand off the objective to follow-on forces with combat power intact.
    key_tasks:
    - id: kt-1
      task: Seize OBJ HAMMER with one company decisive, one shaping, one reserve.
    - id: kt-2
      task: Defeat ENY reserve counterattack forward of PL BRONZE.
    - id: kt-3
      task: 'Preserve combat power: less than 10% friendly casualties through consolidation.'
    - id: kt-4
      task: Maintain continuous fires and ISR coverage through transition to follow-on force.
    end_state:
      summary: OBJ HAMMER under TF IRON control by 190900Z; ENY defeated in sector; TF postured for follow-on.
  concept_of_operations:
    summary: 'TF IRON executes a three-phase attack: PHASE I (Shaping, 180600Z–190500Z) — reconnaissance
      and shaping fires; PHASE II (Decisive, 190500Z–190800Z) — dismounted assault on OBJ HAMMER; PHASE
      III (Consolidate, 190800Z–200600Z) — consolidate and hand off.'
  schemes:
    maneuver:
      summary: 'Phase I: B Co conducts supporting attack on OBJ ANVIL starting 180600Z. A Co moves to
        ASSAULT POSITION SABRE by 190430Z. Phase II: Breach complete 190445Z; artillery prep 190448–190500Z;
        A Co assaults 190500–190700Z; consolidate 190700–190800Z. Phase III: Transfer of authority to
        follow-on force 200500Z.'
    fires:
      summary: Priority of fires A Co (Phase II), then C Co (counterattack defeat). 12-minute artillery
        prep on OBJ HAMMER 190448–190500Z. CAS on call; final attack control by A Co JTAC.
    intelligence:
      summary: Focus on confirming ENY disposition on OBJ HAMMER, validating obstacle belt composition,
        and warning of ENY reinforcement east of HIGHWAY 22. See Annex B.
    protection:
      summary: 'Priorities: (1) A Co assault element; (2) CTCP; (3) BN Main CP. OPSEC: radio silence below
        BN net until 190500Z. Personnel Recovery plan per Annex E, Appendix 9.'
    engineering:
      summary: SAPPER 2 breaches the wire obstacle belt NK 138 779 NLT 190445Z. Survivability effort focuses
        on CTCP and BN Main CP hasty positions. See Annex G.
    information_collection:
      summary: One Puma UAS orbit over OBJ HAMMER 190430–190800Z tasked from BCT. Scout Plt (TACON) reports
        on HIGHWAY 22. See Annex L.
  coordinating_instructions:
    ccir:
      priority_intelligence_requirements:
      - id: pir-1
        question: Is the ENY obstacle belt at NK 138 779 mined or wire only?
      - id: pir-2
        question: What is the ENY reserve posture east of HIGHWAY 22?
      - id: pir-3
        question: Has ENY employed UAS ISR over the AO?
      friendly_force_information_requirements:
      - id: ffir-1
        question: Any friendly unit below 75% combat power.
      - id: ffir-2
        question: Loss of communications with any company commander for >15 min.
      - id: ffir-3
        question: Breach asset (SAPPER 2) combat-ineffective.
    eefi:
    - id: eefi-1
      item: Exact DTG of breach.
    - id: eefi-2
      item: Location of TF reserve (C Co).
    - id: eefi-3
      item: Artillery firing position of STEEL 6.
    rules_of_engagement:
    - id: roe-1
      rule: Standard ROE per theater directive; hostile act / hostile intent only. Positive ID required
        for all direct fire.
    other:
    - id: ci-1
      instruction: All personnel will consume 4 L water/day minimum during operations. Hot meals pushed
        from BSA every 12 hrs.
  tasks_to_subordinate_units:
  - unit: a-co-2-503-in
    tasks:
    - id: t1-1
      task: Move to ASSAULT POSITION SABRE NLT 190430Z.
    - id: t1-2
      task: Assault OBJ HAMMER along AA DIAMOND commencing 190500Z.
    - id: t1-3
      task: Clear eastern spur NLT 190700Z.
    - id: t1-4
      task: Consolidate and prepare to defend NLT 190800Z.
  - unit: b-co-2-503-in
    tasks:
    - id: t2-1
      task: Conduct supporting attack against OBJ ANVIL NLT 180600Z.
    - id: t2-2
      task: Maintain pressure through 190700Z.
    - id: t2-3
      task: Be prepared to transition to reserve at BN direction.
  - unit: c-co-2-503-in
    tasks:
    - id: t3-1
      task: Occupy AA BRONZE NLT 190300Z.
    - id: t3-2
      task: On order, reinforce A Co on OBJ HAMMER.
    - id: t3-3
      task: On order, defeat ENY mounted counterattack along ROUTE DIAMOND.
  - unit: d-co-weapons-2-503-in
    tasks:
