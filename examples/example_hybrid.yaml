  E:
    summary: |-
      Protection priorities are, in order: A Co assault element during Phase II; CTCP vic. NK 118 772; BN Main CP vic. NK 110 765; Btry B firing position vic. NK 105 762. OPSEC posture is radio silence below BN level until 190500ZAPR26; BN CMD and O/I nets operate in EMCON-reduced with scheduled SITREPs only. Cover-and-concealment discipline enforced at AA EAGLE; no fires, no white light, and red-lens only from 181800ZAPR26 until LD.

      CBRN posture is MOPP 0, mission-tailored; enemy CBRN capability is assessed NIL. Personnel recovery plan is keyed to the BN isolated personnel report (ISOPREP) on file with BCT PR cell; primary PR force is C Co reserve, alternate is BCT QRF. Force Health Protection emphasizes tick and vector precaution (permethrin treatment of uniforms, daily tick checks) given the Bavarian spring operating environment; heat/cold risk is MODERATE overnight.

      Safety posture for the live-fire portions of the operation is governed by Grafenwoehr Range SOP and the BN range safety annex. Range OICs and RSOs are identified by company; medevac lanes are ground (primary) via MSR CLUB to Role 2 at BSA and air (alternate) to Landstuhl Regional Medical Center. All risk-mitigation measures from the DD Form 2977 are briefed to platoon level NLT 181800ZAPR26.
  F:
    summary: |-
      The Combat Trains Command Post establishes vic. NK 118 772 NLT 190400ZAPR26 under the HHC commander; the Brigade Support Area remains at Grafenwoehr main cantonment. LOGPACs cycle every 8 hours on MSR CLUB from BSA to CTCP, with push forward to company trains by the HHC 1SG. Ambulance Exchange Point is established vic. NK 125 776 operated by the BN BAS, with a second AXP co-located with the CTCP for Phase III.

      Class I is two hot meals plus MRE daily; Class III(B) resupply is by 2500-gal fuel tanker on the 0400Z LOGPAC; Class V is pre-positioned at the BSA with a full basic load plus 25% for contingency, released forward on call by S-4. Class VIII flows from BCT Role 2 on the BSA routine push; urgent Class VIII moves with MEDEVAC. Class IX repair parts are push-packaged by the BSB distribution company for the 48-hour operation.

      Personnel replacement and casualty reporting flow through the BN S-1 co-located at the CTCP; PERSTAT due every 6 hours. Mortuary affairs collection point is at the BSA, operated by the BSB MA team. Religious support is continuous from the BN UMT; legal support is reachback through BCT OSJA. Host-nation contracting through USAG Bavaria supports billeting and POL reachback.
  G:
    summary: |-
      The scheme of engineer operations is anchored on SAPPER 2 (2d Plt/A/54 BEB, OPCON from 181800ZAPR26) executing the breach of the wire and AT-ditch obstacle belt at NK 138 779 NLT 190445ZAPR26. SAPPER 2 employs one MICLIC on the primary lane (LANE RED) with a second MICLIC in reserve for LANE BLUE; lane-marking is VS-17 panels by day and chemlights by night, with far-side security provided by A Co 1st Plt. Countermobility is not planned in Phase I–II; in Phase III, SAPPER 2 emplaces a hasty point obstacle vic. NK 145 787 to canalize enemy reinforcement along HIGHWAY 22.

      Survivability effort prioritizes the CTCP and BN Main CP; SAPPER 2 provides a SEE (Small Emplacement Excavator) to dig in the TOC and CTCP vehicles NLT 190200ZAPR26. No mobility work is planned on MSR CLUB; the route is confirmed trafficable from Scout Plt reconnaissance NLT 190000ZAPR26. General engineering is limited given the training-area constraints and 48-hour operation window.

      Environmental considerations are significant: Grafenwoehr Training Area is a German federal training facility with strict restrictions on digging, tree removal, and watercourse crossing. All survivability positions are backfilled NLT 200400ZAPR26; no fires in wooded areas outside designated impact zones; spill response kits at every refuel point. Geospatial products (1:25,000 overprints, obstacle overlays, line-of-sight analysis) are pushed by BCT GEOINT cell through SharePoint and Nett Warrior.
  H:
    summary: |-
      Network operations execute under SOI Edition 04-26, effective 181200ZAPR26 through 200600ZAPR26. FM is primary for BN CMD, O/I, FIRES, ADMIN, and MEDEVAC nets; TACSAT is secondary for BN CMD and O/I, with BCT TACSAT channel assignments per SOI. Nett Warrior provides the common operating picture at platoon leader and higher, synchronized with the BN TOC CPOF every 15 minutes. Data services (SharePoint, email) are available at BN Main CP and CTCP via CPN node from BCT signal company.

      The BN S-6 manages organic signal assets and coordinates spectrum use through BCT S-6; JCEOI issued NLT 181600ZAPR26. Frequency-hopping SINCGARS is the standard for all BN nets; single-channel fallback per SOI. COMSEC is loaded NLT 181800ZAPR26 with a 24-hour rollover at 200000ZAPR26; BN S-6 OPCON to CTCP for COMSEC replacement and key management.

      Priority of signal support is BN CMD net, then FIRES net, then O/I, then ADMIN. Retransmission is provided by a single retrans team vic. NK 108 775 to cover the 8-km depth of the AO. Troubleshooting procedures are published in the SOI; any net loss reported to BN S-6 within 5 minutes with channel, callsign, and last known functional time. Tactical call signs listed below are campaign-specific and change with each SOI edition; they are not permanent unit designations.
  J:
    summary: |-
      Public affairs posture is low-profile; IRON STRIKE is an internal training operation with no embedded media and no planned public release. External release authority rests with the 173d IBCT PAO; BN S-3 routes any inquiry through the BCT PAO without comment. Internal audience messaging emphasizes readiness, airborne infantry proficiency, and the strength of the U.S.–German training partnership at Grafenwoehr.

      Soldiers are reminded of OPSEC responsibilities on personal social media: no grids, no timelines, no unit positions, no casualty information. Command Information products (BN newsletter, post-operation photos) are staged through BCT PAO after 200600ZAPR26 with OPSEC review. Any host-nation media encounter on the training area is routed to the BCT HN LNO and BCT PAO.
  K:
    summary: |-
      Civil-military operations in IRON STRIKE are limited to training-area coordination and host-nation partnership. ALTENSTADT village vic. NK 115 790 is protected as a no-fire area and off-limits to ground maneuver; any inadvertent entry is reported immediately to BN S-3 and BCT HN LNO. Liaison with the Bavarian Forestry Authority and Grafenwoehr Range Control is continuous through the BCT HN LNO for range deconfliction, fire danger level, and wildlife advisories.

      There are no populace and resources control operations, no foreign humanitarian assistance, and no civil administration tasks. Bundeswehr Grafenwoehr Training Area Command is the primary host-nation interface for range infrastructure, ammunition handling, and emergency response. Coordination meetings occur daily at 1700Z at Range Control with BN S-3 representation.
  L:
    summary: |-
      Information collection is synchronized to the four PIRs and sequenced by phase. Scout Platoon (TACON to 173 RSTA SQDN through 190430ZAPR26) screens HIGHWAY 22 from 181800ZAPR26, reports any movement south of GRID LINE 80, and provides reconnaissance handover to A Co at PL SILVER. A BCT Puma UAS orbit over OBJ HAMMER from 190430ZAPR26 to 190800ZAPR26 cues A Co and STEEL 6 with full-motion video piped to BN TOC. The BCT MICO provides reinforcing SIGINT against enemy C2 nets.

      Priority intelligence requirements are, in order: (1) enemy reinforcement timing and composition along HIGHWAY 22; (2) obstacle belt composition at NK 138 779; (3) Orlan-10 launch and recovery site; (4) location of enemy CP on OBJ HAMMER. Collection assets are matched to PIRs in the ISR Synchronization Matrix (App 4) with named areas of interest keyed to decision points from Annex C. S-2 chairs the ICR working group at BN TOC at 181800ZAPR26 and 190000ZAPR26.

      Reconnaissance handover and battle handover criteria are published in Appendix 3; Scout Plt chops back to BN control at 190430ZAPR26 and assumes screen to the north along PL COPPER during Phase III. All collection reports flow on BN O/I net with SALUTE format; time-sensitive PIR triggers use flash-precedence SPOTREP.
  M:
    summary: |-
      The commander's assessment priorities are: (1) seizure of OBJ HAMMER NLT 190800ZAPR26; (2) preservation of combat power below 10% casualties across TF IRON; (3) tempo of transition from Phase II decisive to Phase III consolidation. The BN S-3 assessment cell tracks measures of effectiveness and measures of performance against these priorities, with commander-in-the-loop reviews at the 0600Z BUB and 1800Z commander's update brief.

      MOEs include: percent of OBJ HAMMER secured; enemy combat power reduction (%); time elapsed from LD to LOA; A Co combat power remaining at seizure. MOPs include: fires delivered on time per the AGM; breach completed NLT 190445ZAPR26; LOGPAC execution rate; CASEVAC time from point of injury to Role 1 under 30 minutes. Indicators are aligned to each MOE/MOP and reported through BN TOC every 6 hours on BN O/I net.

      Assessment products drive re-planning: the S-3 assessment cell produces a written assessment update at each BUB with recommendations for the commander on branch execution, reserve commitment, and transition timing. Post-operation, an AAR at BN level is conducted NLT 202000ZAPR26 with company input, and the product feeds the BCT lessons-learned repository.
  N:
    summary: |-
      Space-based enablers are critical to IRON STRIKE. GPS PNT supports all dismounted and mounted navigation; DAGRs are issued to squad leader and higher. SATCOM (MUOS narrowband, TACSAT) provides BN-to-BCT reachback as the secondary communications path. ISR tipping from national and theater space assets flows through the BCT ACE to BN S-2 within 30 minutes of collection. No offensive space effects are planned or authorized.

      The space threat assessment is LOW for IRON STRIKE; however, enemy doctrine includes GPS spoofing and jamming, and the Grafenwoehr training area has historically experienced GPS interference during large exercises. Units carry out pre-mission PNT checks, report any GPS anomaly (drift, sudden fix loss, impossible position) through JSIR on BN O/I net within 15 minutes, and fall back to terrain association and map-and-compass when GPS is degraded.

      The BN space officer (dual-hatted with S-6) maintains the running space estimate, submits space support requests through the BCT space support element, and integrates space considerations into the targeting and fires cycle. SATCOM outages, GPS anomalies, and tipping delays are reported immediately to the BN CDR.
  P:
    summary: |-
      Bundeswehr Grafenwoehr Training Area Command provides range infrastructure (impact areas, maneuver boxes, ammunition supply point), ammunition handling support at the Grafenwoehr ASP, emergency response reachback (German fire brigade and Red Cross), and POL reachback through host-nation contract. USAG Bavaria handles billeting at Camp Aachen, DFAC services, and garrison support functions. Host-nation coordination runs through the BCT HN LNO, with BN S-3 as the primary action officer at battalion level.

      Daily synchronization meetings occur at 1700Z at Grafenwoehr Range Control; BN S-3 attends in person with the BCT HN LNO. Any coordination with Bavarian civil authorities (police, forestry, civil defense) flows through Range Control and is not executed at BN level without BCT approval. All host-nation interactions comply with the U.S.–Germany Status of Forces Agreement and Grafenwoehr Range SOP.
  Q:
    summary: |-
      The knowledge management plan structures the BN battle rhythm to support the commander's decision cycle. The daily rhythm is anchored by the Battle Update Brief at 0600Z, the Commander's Update Brief at 1800Z, and a shift-change brief at every TOC hand-off (0600Z and 1800Z). The targeting working group convenes at 181800ZAPR26 and 190000ZAPR26; the sustainment synchronization meeting is at 1200Z daily at the CTCP.

      The SharePoint portal hosts OPORD, WARNORD, and FRAGO version control with clear numbering (IRON STRIKE OPORD 26-04, FRAGO 01, FRAGO 02) and a change log maintained by the BN XO. The Common Operating Picture is maintained at the BN Main CP on CPOF, synchronized from Nett Warrior updates (maneuver), S-2 SITEMPs (enemy), and S-4 LOGSTAT (sustainment) every 15 minutes. Knowledge products (running estimates, assessments, lessons learned) are stored in the SharePoint BN IRON STRIKE workspace.

      Information management discipline: all staff products carry classification markings (UNCLASSIFIED for this operation), version numbers, and DTG of last update. Email traffic below O-3 is minimized; primary staff communication is the BN TOC CPOF chat and Nett Warrior. The BN XO is the KM authority and resolves portal/COP disputes.
  R:
    summary: |-
      Required reports are consolidated to minimize administrative load while preserving commander situational awareness. SITREP is submitted every 6 hours on BN CMD net (0000Z, 0600Z, 1200Z, 1800Z) by every company to BN TOC; format per BN TACSOP. SPOTREP is immediate for any PIR trigger, contact, or significant event; flash precedence on BN O/I net in SALUTE format. LOGSTAT is submitted every 8 hours to S-4 on BN ADMIN net; PERSTAT every 6 hours to S-1 on BN ADMIN net.

      MEDEVAC requests use the 9-line format on BN MEDEVAC net with launch authority at BN TOC; the 15-line IED/UXO report is used for any unexploded ordnance or IED encounter on BN O/I net. Additional reports: Commander's Critical Information Reports (CCIR) trigger immediate voice report to BN CDR through BN TOC; BN SITREP forward to BCT TOC NLT 30 minutes after each 6-hour cycle.

      Report discipline is enforced by the BN TOC battle captain; missed or late reports are logged and addressed at the next BUB. Report formats are published in Appendix 1 and posted at every company CP, BN Main, and CTCP.
  S:
    summary: Special technical operations are not applicable to IRON STRIKE at the UNCLASSIFIED classification
      level. Any STO coordination required during execution will be published separately through secure
      channels and distributed only to personnel with appropriate clearance and need-to-know. Refer questions
      to the BCT S-3 STO cell.
  U:
    summary: Inspector General support is provided by the 173d IBCT IG. No inspections, investigations,
      or assistance visits are scheduled during the 48-hour operation window of IRON STRIKE. The battalion
      maintains an open-door policy for Soldiers at all levels; complaints and IG assistance requests
      flow through the chain of command or, if a Soldier prefers, directly through the BN CSM to the BCT
      IG. Contact information for the BCT IG is posted at every company CP and at the BN Main CP.
  V:
    summary: Interagency coordination for IRON STRIKE is limited to U.S. Army Garrison Bavaria and the
      Bundeswehr. No Department of State, Department of Homeland Security, intergovernmental, or non-governmental
      organization activity is present in the area of operations. The Bavarian Red Cross provides medical
      standby at the Grafenwoehr Range Control clinic under the standing host-nation support agreement.
      All interagency touchpoints run through the BCT HN LNO; BN S-3 is the action officer and does not
      engage non-DoD partners at battalion level without BCT approval.
  Z:
    summary: |-
      Distribution of OPORD 26-04 (IRON STRIKE) is as follows. Primary recipients (action): Commander, A Co (ABLE 6) — Copy 1; Commander, B Co (BRAVO 6) — Copy 2; Commander, C Co (CHARLIE 6) — Copy 3; Commander, D Co Weapons (DOG 6) — Copy 4; Commander, HHC — Copy 5; Commander, 2d Plt/A/54 BEB (SAPPER 2) — Copy 6; Commander, Btry B/4-319 AFAR (STEEL 6) — Copy 7; BN S-1 — Copy 8; BN S-2 — Copy 9; BN S-3 — Copy 10; BN S-4 — Copy 11; BN S-6 — Copy 12; BN CSM — Copy 13; BN XO — Copy 14; BN CDR — Copy 15.

      Adjacent and supporting units (action): Commander, 1-503 IN (follow-on forces for OBJ FALCON hand-off) — Copy 16; Commander, 173 RSTA SQDN — Copy 17; Commander, 54 BEB — Copy 18; Commander, 4-319 AFAR — Copy 19; Commander, 173 BSB — Copy 20.

      Information copies: 173d IBCT (A) TOC — Copy 21; 173d IBCT S-3 — Copy 22; 4-319 AFAR TOC — Copy 23; 54 BEB TOC — Copy 24; 173 BSB TOC — Copy 25; Grafenwoehr Range Control — Copy 26; BCT HN LNO — Copy 27; BCT PAO — Copy 28; BCT IG — Copy 29; BN Historical File — Copy 30. Total: 30 copies. Distribution complete NLT 181800ZAPR26 by BN S-1.
