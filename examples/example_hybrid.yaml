  D:
    summary: |-
      Priority of fires is A Co during Phase I–II through seizure of OBJ HAMMER, then shifts to C Co during Phase III for counterattack defeat. STEEL 6 (Btry B/4-319 AFAR, 6x M119A3) executes a 12-minute preparation from 190448ZAPR26 to 190500ZAPR26 on OBJ HAMMER, targeting enemy platoon battle positions, the 82mm mortar section, and the ZU-23 position, followed by shift fires to suppress the reverse slope as A Co crosses PL SILVER. CAS is on-call through the BCT JTAC stack, with two F-16 sorties on 30-minute strip alert from Spangdahlem, callsigns VIPER 11/12.

      Fire Support Coordination Measures: CFL along PL BRONZE effective 190500ZAPR26; NFA 500m radius around ALTENSTADT village vic. NK 115 790 effective throughout the operation; RFA over BSA and CTCP; coordinated fire line advances to PL COPPER at transition to Phase III. FSCOORD (STEEL 6) clears all fires forward of PL SILVER through BN CDR or XO. Counterfire radar coverage is provided by BCT Q-53 cueing to STEEL 6 within 3 minutes of enemy indirect fire.

      Attack Guidance Matrix: HPTs are engaged with priority — enemy CP (neutralize, artillery, immediate); ZU-23 (destroy, CAS or artillery, immediate); mortar section (neutralize, artillery, immediate); BMP-2s (destroy, Javelin/TOW/CAS, as acquired); Orlan-10 GCS (destroy, artillery on BCT cueing). Ammunition priority is DPICM-equivalent HE, smoke for breach obscuration at 190440ZAPR26, and illumination on call.
