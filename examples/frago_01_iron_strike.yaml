- op: replace
  path: /situation/enemy_forces
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    summary: Motorized rifle company (+) templated on OBJ HAMMER; est. 120 PAX with 4× BMP-2, 2× 82mm
      mortar, 1× ZU-23 AAA, engineer squad. Company is dug in, two platoons forward, one in reserve.
    courses_of_action:
    - id: coa-most-likely
      kind: most_likely
      summary: |-
        Revised: ENY reinforces OBJ HAMMER from the north NLT 190600Z
        with armor package; defends forward slope with dug-in MRC + T-72 section.
        Previous MLCOA (defend from reverse slope only) is superseded. This
        directly threatens the base-order end state ("OBJ HAMMER under TF IRON control by 190900Z; ENY defeated in sector; TF postured for follow-on.")
        unless the armor package is destroyed prior to LOA.
    - id: coa-most-dangerous
      kind: most_dangerous
      summary: ENY pre-empts the attack with a spoiling raid at 180400Z against friendly assembly area
        at GRAFENWOEHR (OBJ TUNGSTEN), followed by deliberate defense of OBJ HAMMER and commitment of
        a reinforcing company (+) from the EAST.
- op: replace
  path: /execution/coordinating_instructions
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    effective_time: '2026-04-19T02:00:00Z'
    ccir:
      priority_intelligence_requirements:
      - id: pir-1
        question: Is the ENY obstacle belt at NK 138 779 mined or wire only?
      - id: pir-2
        question: What is the ENY reserve posture east of HIGHWAY 22?
      - id: pir-3
        question: Has ENY employed UAS ISR over the AO?
      friendly_force_information_requirements:
      - id: ffir-1
        question: Any friendly unit below 75% combat power.
      - id: ffir-2
        question: Loss of communications with any company commander for >15 min.
      - id: ffir-3
        question: Breach asset (SAPPER 2) combat-ineffective.
    eefi:
    - id: eefi-1
      item: Exact DTG of breach.
    - id: eefi-2
      item: Location of TF reserve (C Co).
    - id: eefi-3
      item: Artillery firing position of STEEL 6.
    rules_of_engagement:
    - id: roe-1
      rule: Standard ROE per theater directive; hostile act / hostile intent only. Positive ID required
        for all direct fire.
    other:
    - id: ci-1
      instruction: |-
        H-hour REMAINS 190500ZAPR26 per base OPORD 26-04
        (IRON STRIKE), issued by 173d IBCT (A). Phase II timing
        unchanged. Commander's intent purpose (base order) remains in force — this FRAGO
        reorients A Co priority of engagement and shifts Scout Plt to observe NAI 8
        (newly designated, see Annex B below) to preserve the base-order key task:
        "Defeat ENY reserve counterattack forward of PL BRONZE." TF IRON 6
        retains control.
- op: remove
  path: /execution/tasks_to_subordinate_units
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
- op: replace
  path: /annexes/B
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    summary: |-
      UPDATE TO ANNEX B: New NAI 8 designated vic NK 150 795 covering armor avenue
      of approach from the north on HIGHWAY 22 into OBJ HAMMER. Scout Plt
      assumes primary coverage of NAI 8; BCT Puma UAS retains orbit over NAI 7 per
      base order. SIGINT cueing on MRB armor net added to collection matrix. Collection
      plan nests under the base-order mission: "TF IRON attacks NLT 190500ZAPR26 to seize OBJ HAMMER (vic. NK 142 783) IOT enable 173d IBCT (A) follow-on operations against OBJ FALCON."
- op: replace
  path: /annexes/D
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    summary: |-
      UPDATE TO ANNEX D: JPITL revised. New priority-1 target designated (armor package).
      SEAD window shifted to cover armor package approach. Fire support coordination
      measures unchanged.
