changes:
- op: replace
  path: /extensions/org.opord-builder.order/situation
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    area_of_interest: The area of interest extends 50 km beyond the AO boundary, encompassing HIGHWAY
      22 eastbound to the BORDER (grid N7234) and all towns and transportation nodes that could resource
      enemy reinforcement of OBJ HAMMER within 24 hours.
    area_of_operations:
      terrain:
        avenues_of_approach: Two platoon-sized mounted AAs from the south (ROUTE CLUB, ROUTE SPADE); one
          company-sized dismounted AA along the eastern treeline (ROUTE DIAMOND).
        cover_and_concealment: Dense coniferous cover throughout the AO; limited cover in the cleared-fields
          corridor (east-west). Urban cover in VIC ALTENSTADT (NK 115 790).
        key_terrain: 'OBJ HAMMER (MR-342 ridge). Decisive terrain: the eastern spur, grid NK 142 783,
          which controls observation of ENY fallback positions.'
        observation_and_fields_of_fire: OBJ HAMMER sits on a 340m ridgeline offering 3–4 km observation
          east; forest canopy restricts fields of fire to <200m off the ridge.
        obstacles: Stream line along PL BRONZE (fordable for dismounts); mined wire obstacle belt templated
          vicinity NK 138 779 (IPB-confirmed).
      weather:
        climate_baseline: 'Bavarian Oberpfalz late-April climatology: daytime 8–16°C, nightly 2–6°C; prevailing
          winds W/SW 8–12 kt; monthly precipitation ~55 mm (primarily afternoon showers); freeze risk
          LOW after 15 APR. Typical ceiling 3,500– 8,000 ft with 40–60% probability of BKN mid-level cloud.
          Training area has historically experienced morning ground-fog episodes ≤2 km visibility until
          ~0700L in valleys (ROUTE CLUB east leg).'
        cloud_cover: BKN 4,500 ft; overcast by 181800Z; CAS ceiling remains above 3,000 ft AGL.
        forecast_confidence: HIGH — 72-hr forecast; synoptic pattern stable; SWO confidence HIGH.
        precipitation: 40% chance intermittent rain 181400Z–182000Z; trafficability degraded on ROUTE
          CLUB.
        swo_product_reference: Annex B, Appendix 1, Tab B (Weather). SWO Product 26-04-WX-019 (173d IBCT
          SWO, 181200ZAPR26).
        temperature_and_humidity: Hi 14°C / Lo 4°C; RH 78%. Cold-weather injury risk LOW.
        visibility: 8–10 km; daylight; reducing to 2 km with forecast afternoon precip.
        winds: W 10–15 kt, gusts to 22 kt; favors friendly fires dispersion.
        forecasts:
        - phase_or_day: Phase I (Shaping, D-1 / 18 APR)
          visibility: 10 km dropping to 2 km 181400Z–182000Z in showers.
          winds: W 10–15 kt, gusts 22 kt.
          precipitation: 40% intermittent rain 181400–182000Z; 2–4 mm accum.
          cloud_cover: BKN 4,500 ft, dropping to OVC 3,500 ft by 181800Z.
          temperature_and_humidity: Hi 14°C / Lo 5°C; RH 70–85%.
        - phase_or_day: Phase II (Decisive, D-Day / 19 APR, 0500Z–0800Z)
          visibility: 10+ km; clear to partly cloudy.
          winds: W 8–12 kt, backing SW.
          precipitation: Dry window; 10% POP.
          cloud_cover: SCT 5,000 ft; CAS stack clear.
          temperature_and_humidity: Hi 12°C (predicted peak 1400Z) / Lo 4°C at H-hour; RH 65%.
        - phase_or_day: Phase III (Consolidate, D-Day to D+1 / 19–20 APR)
          visibility: afternoon SCT 5,000 ft.
          winds: W 10 kt.
          precipitation: 10% POP 192000Z–200200Z — monitor.
          cloud_cover: SCT 5,000 ft; OVC 8,000 overnight.
          temperature_and_humidity: Hi 15°C / Lo 3°C; RH 55–70%.
        light_data:
          '2026-04-19':
            moon_phase: waxing gibbous
    attachments_and_detachments:
      attachments:
      - 2d Plt / A Co / 54th BEB (OPCON from 181800ZAPR26)
      - Btry B / 4-319 AFAR (DS from 180600ZAPR26)
      detachments:
      - Scout Plt / HHC / 2-503 IN (TACON to 173 RSTA, 180600ZAPR26–200600ZAPR26)
      note: See Annex A (Task Organization) for detailed relationships.
    civil_considerations:
      areas: Training area bounded by civilian farmland north of PL STEEL; civilian access to forest mushroom-gathering
        trails must be deconflicted.
      capabilities: Local Bundeswehr MP can respond to training incidents within 20 min; Vilseck hospital
        (Role 3 equivalent) 18 km east.
      events: Easter holiday weekend active in adjacent villages; no impact on AO.
      organizations: Bavarian Forestry Authority monitors live-fire boundary compliance.
      people: Range workers (Bundeswehr civilians) transit range roads 0530–1800L. All movement on ROUTE
        CLUB between those times requires range-control clearance.
      structures: 'Protected: ALTENSTADT village chapel (NK 115 790); no direct or indirect fires within
        500m. Historical marker at NK 121 788.'
    enemy_forces:
      capabilities: Defend in place; counterattack with a mounted platoon (+) within 2 hrs; disrupt with
        indirect fires from 82mm mortars out to 4 km; limited UAS (Orlan-10 templated) capability for
        ISR.
      recent_activities: |-
        UPDATE (BCT Puma FMV 190045ZAPR26): ENY armor reinforcement detected
        vic NK 150 795 — assessed 2x T-72B3 + 1x BMP-2 support element
        moving south on HIGHWAY 22. Arrival OBJ HAMMER estimated
        190600ZAPR26 (60 min after H-hour 190500ZAPR26). MLCOA revised accordingly.
    friendly_forces:
      adjacent_units: 'NORTH: 1-503 IN conducts supporting attack to fix ENY on OBJ ANVIL. SOUTH: 4-319
        AFAR provides GS fires. EAST: 173 RSTA conducts screen along HIGHWAY 22.'
      other_units: Host-nation Bundeswehr liaison element co-located at BCT MAIN CP for range deconfliction
        and civil coordination.
    interagency_intergovernmental_ngo: Bundeswehr Grafenwoehr Training Area Command, Bavarian Red Cross
      (range medical standby), and USAG Bavaria coordinate on training-area access, safety, and emergency
      response.
- op: replace
  path: /extensions/org.opord-builder.order/execution
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    assessment: 'MOEs: (1) seizure of OBJ HAMMER by 190900Z; (2) enemy combat power on OBJ HAMMER reduced
      below 30%; (3) friendly casualties below 10%. MOPs: breach complete NLT 190445Z; artillery rounds
      on target per TVA; transition to follow-on NLT 200600Z. See Annex M.'
    commanders_intent:
      end_state_civil: No civilian casualties; ALTENSTADT village and cultural sites unaffected.
      end_state_enemy: Enemy force on OBJ HAMMER destroyed or forced to withdraw east of HIGHWAY 22.
      end_state_friendly: TF IRON consolidated on OBJ HAMMER, >90% combat power, Class V at 70% basic
        load.
      end_state_terrain: OBJ HAMMER (MR-342 ridge) and eastern spur under friendly control and observation.
    concept_of_operations:
      decisive_operation: A Co assaults OBJ HAMMER at 190500Z, seizes the ridge and eastern spur, and
        consolidates.
      fires: See Annex D. Priority of fires to A Co during Phase II.
      maneuver: A Co conducts the decisive operation as the main effort with dismounted assault along
        AA DIAMOND. B Co fixes ENY on OBJ ANVIL. C Co is reserve prepared to reinforce A Co or defeat
        counterattack. D Co provides direct-fire support from SBF-1 (NK 132 778).
      reserve: C Co is reserve, held at AA BRONZE, prepared to reinforce A Co (PRIORITY) or block enemy
        counterattack along ROUTE DIAMOND.
      shaping_operations: B Co fixes the ENY platoon on OBJ ANVIL; SAPPER 2 breaches the wire obstacle
        belt at NK 138 779 NLT 190430Z; STEEL 6 delivers 12-minute artillery preparation on OBJ HAMMER
        190448Z–190500Z.
      sustaining_operations: Combat Trains (CTCP) established vicinity NK 118 772 by 190400Z. Ambulance
        exchange point (AXP) at NK 125 776. CL III/V resupply by LMTV convoy from BSA every 8 hrs.
    coordinating_instructions:
      acm: Restricted Operations Zone over OBJ HAMMER 190400–190800Z to 5,000 ft AGL for friendly UAS.
      cema: EW detection reports directly to BN S-2; no offensive effects at BN level.
      environmental_considerations: No pyrotechnic use within 100m of ALTENSTADT; fuel/waste returned
        to BSA.
      fscm: Coordinated Fire Line along PL BRONZE. No-fire area 500m radius around ALTENSTADT village
        (NK 115 790).
      personnel_recovery: Isolated-personnel reporting to BN TOC; recovery by C Co on order. ISOPREP current
        for all personnel.
      risk_reduction_control_measures: All live-fire conducted under range-safety oversight. Chemlight
        recognition signals for night movement. No-fire 500m bubble around ALTENSTADT. MOPP level 0 (mission-tailored).
      themes_and_messages:
      - We train hard to fight and win.
      - We honor our host-nation partners.
      - Every paratrooper is accountable.
    scheme_of_cema: GPS, SATCOM, and FM remain unrestricted. No offensive cyber effects tasked at BN.
      EW detection alarm to BN S-2 on any jamming above threshold.
    scheme_of_military_deception: No deception operation planned for this mission.
    scheme_of_reconnaissance_and_security: Scout Plt (TACON to 173 RSTA) screens along HIGHWAY 22 NLT
      180600Z through 200600Z; provides early warning of eastern ENY movement. TF IRON R&S elements observe
      OBJ HAMMER from OP 1 (NK 131 780) and OP 2 (NK 144 785) from 181200Z.
    scheme_of_signal: 'FM primary, TACSAT secondary. Battalion command net, fires net, and logistics net
      active. Data: Nett Warrior for COP. See Annex H.'
    scheme_of_sustainment: See Paragraph 4 and Annex F.
    stability: Not applicable for this mission — limited to training area; no host-nation civilian effects
      beyond range deconfliction.
    tasks_to_subordinate_units:
    - callsign: ABLE 6
      purpose: Refocus priority of engagement from dismounted MRC to armor reinforcement package.
      tasks:
      - Re-orient SBF-1 (NK 135 776) to engage armor approaching from NAI 8 (NK 150 795) on cue.
      - Hold assault timing — Phase II LD remains 190500ZAPR26.
      - Coordinate Javelin team placement with D Co Wpns for armor engagement priority.
      unit: A Co / 2-503 IN
    - callsign: SAPPER 2
      purpose: Confirm armor package composition and timing of arrival at OBJ HAMMER.
      tasks:
      - Establish OP vic NK 148 790 NLT 190300ZAPR26.
      - Report all armor observations via SPOT format to BN FIRES net within 3 minutes of observation.
      - BDA support after Phase II IOT confirm armor neutralization.
      unit: Scout Plt
- op: replace
  path: /extensions/org.opord-builder.order/annexes/B
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    status: published
    typed_body:
      priority_intelligence_requirements:
      - decision_supported: Commit C Co (reserve) to blocking position vic NK 128 787; redirect A Co priority
          engagement to armor package.
        indicators:
        - 2+ T-72 class armor signature on HIGHWAY 22 south of GRID LINE 85
        - MRB armor-net activity vic 150 810
        ltiov: 190430ZAPR26
        nai:
        - NAI 8 (NK 150 795 on HIGHWAY 22)
        number: 5
        primary_collector: Scout Plt OP 3 (NK 148 790)
        statement: When and in what composition will ENY armor reinforcement arrive at OBJ HAMMER from
          the north?
- op: replace
  path: /extensions/org.opord-builder.order/annexes/D
  target:
    kind: opord
    id: opord-26-04
    revision: '1'
  value:
    status: published
    typed_body:
      jpitl:
      - approval_authority: BCT Cdr
        authorized_engagement_means:
        - HIMARS PGM (prime)
        - M777 HE/PD + VT (two-volley fire-for-effect)
        - AH-64 Hellfire (on-call if VIPER 11/12 unavailable)
        category: MANEUVER
        cde_level: CDE-2
        component_tasked: LAND
        desired_effect: DESTROY
        engagement_guidance: |-
          Engage the armor package at NAI 8 BEFORE it reaches OBJ HAMMER. Two-volley
          FFE on acquisition; shift to BDA with Scout Plt cueing. CDE-2 with CDE-3 weaponeering
          substitution if civilian vehicles present within 500m. Effects must be complete prior
          to H-hour (190500ZAPR26) to preserve Phase II tempo.
        linked_hvt_rank: 5
        location: 32UMA150795
        priority_rank: 1
        review_dtg: 190600ZAPR26
        roe_constraints: No cluster munitions; PID via BCT Puma FMV + SIGINT confirm.
        status: APPROVED
        target_description: Reinforcing armor package moving south on HIGHWAY 22. Confirmed by BCT Puma
          FMV 190045Z.
        target_name: ENY armor package HWY 22 (2x T-72B3 + BMP-2)
        target_number: TGT 0045
